[project]
name = "kasvisie"
version = "0.2.0"
description = "KasVisie - interactief kasprognose-dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "holidays>=0.50",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
